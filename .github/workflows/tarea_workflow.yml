name: Python Container Workflow
on: [push]
jobs:
  run-in-python-container:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-alpine

    steps:
      - name: Descargar el repositorio        
        uses: actions/checkout@v4

      - name: Verificar versión del entorno     
        run: |
          python --version

      - name: Ejecutar script de python     
        run: python -c 'print("Hola desde el contenedor    
          Docker de Python en GitHub Actions")'